<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Syntro GPS V12.7 PRO</title>
    
    <link rel="stylesheet" href="leaflet.css" />
    <script src="leaflet.js"></script>
    <script src="proj4.js"></script>
    <script src="turf.min.js"></script>
    
    <style>
        :root { --s-navy: #184e77; --s-lime: #d9ed92; --bg: #e9ecef; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; background: var(--bg); }
        
        #map-container { flex: 1; height: 100vh; display: block; background: #222; }
        #map { height: 100%; width: 100%; }

        .panel { width: 600px; background: var(--bg); display: flex; flex-direction: column; height: 100vh; z-index: 1000; }
        .panel-full { width: 100% !important; flex: 1 !important; }
        
        .header { background: var(--s-navy); color: white; padding: 12px; display: flex; align-items: center; justify-content: space-between; border-bottom: 4px solid var(--s-lime); }
        
        .toolbar { padding: 15px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn-gps { grid-column: span 2; background: var(--s-navy); color: white; height: 65px; border: none; font-size: 1.1rem; font-weight: bold; border-radius: 12px; cursor: pointer; }
        
        .btn-export { padding: 12px; border-radius: 10px; border: 1px solid #ccc; font-weight: bold; background: white; color: var(--s-navy); cursor: pointer; }

        .stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; padding: 0 15px; margin-bottom: 10px; }
        .stat-card { background: white; padding: 10px; border-radius: 10px; text-align: center; border: 1px solid #ddd; }
        .stat-card b { color: var(--s-navy); font-size: 1rem; }

        .table-wrap { flex: 1; overflow: auto; margin: 0 15px 15px; background: white; border-radius: 10px; border: 1px solid #ddd; }
        table { width: 100%; border-collapse: collapse; min-width: 600px; }
        th { background: #f4f4f4; padding: 10px; border-bottom: 2px solid var(--s-lime); position: sticky; top: 0; z-index: 10; }
        td { padding: 8px; text-align: center; border-bottom: 1px solid #eee; font-size: 0.85rem; }
        
        .inp-obs { width: 90%; border: 1px solid #ccc; border-radius: 4px; padding: 4px; font-size: 0.8rem; }
        .sel-tipo { padding: 4px; border-radius: 4px; font-weight: bold; }

        @media (max-width: 850px) {
            body { flex-direction: column; }
            #map-container { height: 35vh; width: 100%; }
            .panel { width: 100%; height: 65vh; }
        }
    </style>
</head>
<body>

<div id="map-container"><div id="map"></div></div>

<div class="panel" id="main-panel">
    <div class="header">
        <span style="font-weight: bold;">SYNTRO V12.7 PRO</span>
        <button onclick="toggleVista()" style="background:var(--s-lime); border:none; padding:8px 12px; border-radius:8px; font-weight:bold; cursor:pointer;">🗺️ MAPA ON/OFF</button>
    </div>
    
    <div class="toolbar">
        <button id="mainBtn" class="btn-gps" onclick="capturar()">📍 CAPTURAR VÉRTICE</button>
        <button class="btn-export" onclick="exportGeoJSON()">📥 GEOJSON</button>
        <button class="btn-export" onclick="exportCSV()">📥 EXCEL (CSV)</button>
        <button style="color:#e74c3c; grid-column: span 2; font-size: 0.85rem; background: none; border: none; cursor:pointer; font-weight:bold;" onclick="limpiar()">🗑️ BORRAR TODO</button>
    </div>

    <div class="stats">
        <div class="stat-card"><small>ZONA</small><br><b id="utm-zona">-</b></div>
        <div class="stat-card"><small>ÁREA (HA)</small><br><b id="area-val">0.0000</b></div>
        <div class="stat-card"><small>PERIM (M)</small><br><b id="perim-val">0.00</b></div>
    </div>

    <div class="table-wrap">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>TIPO</th>
                    <th>ESTE (X)</th>
                    <th>NORTE (Y)</th>
                    <th>OBSERVACIÓN</th>
                    <th>DEL</th>
                </tr>
            </thead>
            <tbody id="body-tabla"></tbody>
        </table>
    </div>
</div>

<script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('service-worker.js').catch(() => {});
    }

    let datos = JSON.parse(localStorage.getItem('syntro_v12_7')) || [];
    let marcadores = [];
    let map;
    let areaHectareas = 0;
    let perimetroMetros = 0;

    try {
        map = L.map('map', { zoomControl: false, fadeAnimation: false }).setView([10, -67], 5);
        if (navigator.onLine) {
            L.tileLayer('https://{s}.google.com/vt/lyrs=s,h&x={x}&y={y}&z={z}', {
                maxZoom: 22, subdomains:['mt0','mt1','mt2','mt3']
            }).addTo(map);
        }
    } catch (e) { console.log("Offline Mode Active"); }

    const capaPol = L.polygon([], {color: '#d9ed92', weight: 3, fillOpacity: 0.3}).addTo(map);

    function toggleVista() {
        const mContainer = document.getElementById('map-container');
        const mPanel = document.getElementById('main-panel');
        if (mContainer.style.display !== 'none') {
            mContainer.style.display = 'none';
            mPanel.classList.add('panel-full');
        } else {
            mContainer.style.display = 'block';
            mPanel.classList.remove('panel-full');
            if(map) setTimeout(() => { map.invalidateSize(); }, 100);
        }
    }

    function getUTMData(lat, lng) {
        const zone = Math.floor((lng + 180) / 6) + 1;
        const def = `+proj=utm +zone=${zone} +ellps=WGS84 +datum=WGS84 +units=m +no_defs`;
        const coords = proj4("EPSG:4326", def, [lng, lat]);
        return { x: coords[0], y: coords[1], zone: zone };
    }

    function capturar() {
        const btn = document.getElementById('mainBtn');
        btn.innerText = "🛰️ BUSCANDO GPS...";
        navigator.geolocation.getCurrentPosition(pos => {
            const { latitude: lat, longitude: lng } = pos.coords;
            const utm = getUTMData(lat, lng);
            datos.push({ lat, lng, x: utm.x, y: utm.y, zone: utm.zone, tipo: 'POL', dist: 0, obs: '' });
            btn.innerText = "📍 CAPTURAR VÉRTICE";
            actualizar();
        }, err => { 
            alert("Error GPS: " + err.message); 
            btn.innerText = "📍 CAPTURAR VÉRTICE";
        }, { enableHighAccuracy: true });
    }

    function actualizar() {
        localStorage.setItem('syntro_v12_7', JSON.stringify(datos));
        marcadores.forEach(m => map.removeLayer(m));
        marcadores = [];
        const tbody = document.getElementById('body-tabla');
        tbody.innerHTML = "";
        
        let ptsPol = [];
        let totalP = 0;
        let lastX = null, lastY = null;

        datos.forEach((p, i) => {
            // Cálculos de distancia solo para tipo Polígono
            if(p.tipo === 'POL') {
                if(lastX !== null) p.dist = Math.sqrt(Math.pow(p.x - lastX, 2) + Math.pow(p.y - lastY, 2));
                totalP += p.dist; lastX = p.x; lastY = p.y;
                ptsPol.push([p.lat, p.lng]);
            }
            
            // Color según tipo: Azul para Polígono, Naranja para Puntos sueltos
            const colorCircle = (p.tipo === 'POL') ? '#184e77' : '#e67e22';
            
            if(map) {
                marcadores.push(L.circleMarker([p.lat, p.lng], { 
                    radius: 6, color: 'white', fillColor: colorCircle, fillOpacity: 1 
                }).addTo(map).bindPopup(`ID: ${i+1}<br>${p.obs}`));
            }

            tbody.innerHTML += `<tr>
                <td>${i+1}</td>
                <td>
                    <select class="sel-tipo" onchange="cambiarTipo(${i}, this.value)">
                        <option value="POL" ${p.tipo==='POL'?'selected':''}>POL</option>
                        <option value="PTS" ${p.tipo==='PTS'?'selected':''}>PTS</option>
                    </select>
                </td>
                <td>${p.x.toFixed(2)}</td>
                <td>${p.y.toFixed(2)}</td>
                <td><input type="text" class="inp-obs" value="${p.obs}" onchange="cambiarObs(${i}, this.value)" placeholder="..."></td>
                <td onclick="borrar(${i})" style="color:red; cursor:pointer; font-weight:bold;">×</td>
            </tr>`;
        });

        if(map) capaPol.setLatLngs(ptsPol);
        perimetroMetros = totalP;
        document.getElementById('perim-val').innerText = perimetroMetros.toFixed(2);
        document.getElementById('utm-zona').innerText = datos.length ? datos[0].zone + "N" : "-";
        
        if(ptsPol.length > 2 && typeof turf !== 'undefined') {
            areaHectareas = turf.area(capaPol.toGeoJSON()) / 10000;
            document.getElementById('area-val').innerText = areaHectareas.toFixed(4);
        } else {
            areaHectareas = 0;
            document.getElementById('area-val').innerText = "0.0000";
        }
    }

    function cambiarTipo(i, v) { datos[i].tipo = v; actualizar(); }
    function cambiarObs(i, v) { datos[i].obs = v; localStorage.setItem('syntro_v12_7', JSON.stringify(datos)); }
    function borrar(i) { datos.splice(i,1); actualizar(); }
    function limpiar() { if(confirm("¿Borrar todo?")) { datos = []; actualizar(); } }

    function exportGeoJSON() {
        if(!datos.length) return;
        const features = datos.map((p, i) => ({
            type: "Feature",
            geometry: { type: "Point", coordinates: [p.lng, p.lat] },
            properties: { id: i+1, tipo: p.tipo, x: p.x, y: p.y, obs: p.obs }
        }));
        const polCoords = datos.filter(p => p.tipo === 'POL').map(p => [p.lng, p.lat]);
        if(polCoords.length > 2) {
            const closure = [...polCoords, polCoords[0]];
            features.push({
                type: "Feature",
                geometry: { type: "Polygon", coordinates: [closure] },
                properties: { area_ha: areaHectareas.toFixed(4), perimetro_m: perimetroMetros.toFixed(2) }
            });
        }
        descargar(JSON.stringify({ type: "FeatureCollection", features }), `SYNTRO_${Date.now()}.geojson`, "application/json");
    }

    function exportCSV() {
        if(!datos.length) return;
        let csv = "ID,TIPO,ESTE_X,NORTE_Y,OBSERVACION,LAT,LNG\n";
        datos.forEach((p, i) => {
            csv += `${i+1},${p.tipo},${p.x.toFixed(3)},${p.y.toFixed(3)},"${p.obs}",${p.lat},${p.lng}\n`;
        });
        descargar(csv, `REPORTE_SYNTRO_${Date.now()}.csv`, "text/csv;charset=utf-8");
    }

    function descargar(contenido, nombre, tipo) {
        const blob = new Blob([contenido], { type: tipo });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url; a.download = nombre; a.click();
        URL.revokeObjectURL(url);
    }

    actualizar();
</script>
</body>
</html>
